# Phase 2 experimental stack. It has no connection to the Piwigo network and
# must only be started after verify-immich-spike.ps1 accepts the upstream lock.
name: ${IMMICH_COMPOSE_PROJECT_NAME:-class-archive-immich-spike}

services:
  immich-server:
    profiles: ["immich-spike"]
    # The v3.1.0 tag is retained for human traceability, while the digest is
    # the immutable admission reference recorded in immich-upstream.lock.json.
    image: ghcr.io/immich-app/immich-server:v3.1.0@sha256:079cc990b26a88d71f96027341c67329cb11829d4c341ce33b3718fe0f84cbfa
    env_file: ${IMMICH_SPIKE_ENV_FILE:-.env}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Deliberately no host port. A future Class Archive Gateway will be the
    # only localhost listener and will issue MediaGuard URLs after policy
    # filtering. Direct Immich routes must never reach a browser.
    expose:
      - "2283"
    volumes:
      # Immich-owned cache/index data. This is never a Piwigo original mount.
      - immich_upload:/data
      # The only Piwigo originals exposed to the spike. Both mounts are
      # read-only and no Piwigo database, data, derivative or script volume is
      # available in this compose project.
      - piwigo_uploads:/external/piwigo-upload:ro
      - piwigo_galleries:/external/piwigo-galleries:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - immich_internal
      # The ML parser is isolated from Postgres/Redis on its own internal
      # network. The server is the only service that spans both networks.
      - immich_ml_internal
      # Metadata-only bridge traffic gets a third private segment.  The
      # bridge must never share Redis/Postgres DNS or queue/cache access.
      - immich_bridge_internal
    restart: "no"

  immich-machine-learning:
    profiles: ["immich-ml"]
    # Do not replace this with a floating tag. Upgrade by changing the source
    # pin, verified platform digest, lock evidence and compatibility suite.
    image: ghcr.io/immich-app/immich-machine-learning:v3.1.0@sha256:a25ddad7d6d2ab18a161176731dc171bb7e39c0e9dd3884fb1ec629dab535d05
    user: "65532:65532"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      TZ: ${TZ:-UTC}
      MPLCONFIGDIR: /tmp/matplotlib
      # The ML service never gets an egress-capable network. These explicit
      # offline flags make a cache miss fail immediately even if a future
      # compose change accidentally connects the service to another network.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      # Cold-start preload is deliberate evidence that the verified cache is
      # complete. The pinned source otherwise loads models only on first use.
      MACHINE_LEARNING_PRELOAD__CLIP__TEXTUAL: "ViT-B-32__openai"
      MACHINE_LEARNING_PRELOAD__CLIP__VISUAL: "ViT-B-32__openai"
      MACHINE_LEARNING_PRELOAD__FACIAL_RECOGNITION__DETECTION: "buffalo_l"
      MACHINE_LEARNING_PRELOAD__FACIAL_RECOGNITION__RECOGNITION: "buffalo_l"
      # v3.1.0 otherwise rewrites recognition/model.onnx to add a dynamic
      # batch axis. Keeping batch size 1 preserves the verified artifact
      # digest and avoids a writable-model exception during offline startup.
      MACHINE_LEARNING_MAX_BATCH_SIZE__FACIAL_RECOGNITION: "1"
    volumes:
      # A verified model cache is an immutable runtime input. The ML service
      # may read it but cannot replace a 0444 artifact or fetch a cache miss.
      - immich_model_cache:/cache:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    networks: [immich_ml_internal]
    restart: "no"

  # This is deliberately not an Immich Web proxy. It is a tiny, metadata-only
  # adapter that is started only by the explicit integration-test profile. It
  # receives policy-filtered canonical/photo bindings from Piwigo and can call
  # only the fixed internal Immich API. It exposes no host port, no media
  # endpoint, and has no mount to Piwigo originals or either application DB.
  immich-gateway:
    profiles: ["immich-gateway-integration"]
    image: ghcr.io/immich-app/immich-server:v3.1.0@sha256:079cc990b26a88d71f96027341c67329cb11829d4c341ce33b3718fe0f84cbfa
    entrypoint: ["node", "/bridge/server.mjs"]
    user: "65532:65532"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      IMMICH_GATEWAY_SECRET_FILE: /run/secrets/bridge.json
    depends_on:
      immich-server:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      - ./bridge:/bridge:ro
      # The runner copies a one-time bridge credential into the companion
      # stager's private volume. Avoid a Windows host bind here:
      # Docker Desktop cannot reliably read an owner-only Windows file without
      # weakening its ACL. This service has read-only access to that volume.
      - immich_gateway_secret:/run/secrets:ro
    tmpfs:
      - /tmp:mode=1777,size=8m
    networks:
      immich_bridge_internal: {}
      # Match the fixed authority in BridgeImmichAdapter. The alias lives only
      # on the internal Piwigo↔bridge network; it is neither a host listener
      # nor a caller-controlled destination.
      class_archive_gateway:
        aliases: [class-archive-immich-gateway]
    restart: "no"

  # No network and no host bind. The test runner starts this service only long
  # enough to receive a one-time JSON credential over docker exec stdin, set
  # its mode to 0600, and then start immich-gateway. `down --volumes` removes
  # the entire volume on both success and failure.
  immich-gateway-secret-stager:
    profiles: ["immich-gateway-integration"]
    image: ghcr.io/immich-app/immich-server:v3.1.0@sha256:079cc990b26a88d71f96027341c67329cb11829d4c341ce33b3718fe0f84cbfa
    entrypoint: ["sh", "-lc", "trap 'exit 0' INT TERM; while :; do sleep 3600; done"]
    # Docker initializes a named volume as root-owned. This one-purpose
    # stager needs CAP_CHOWN only to give its one secret file to the
    # unprivileged bridge account; it has no network or host mount.
    user: "0:0"
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:mode=1777,size=8m
    volumes:
      - immich_gateway_secret:/run/secrets:rw
    network_mode: "none"
    restart: "no"

  # Local-only Web compatibility spike. The service serves the verified
  # upstream static build but receives no Immich/Piwigo database or original
  # mount. It can call only the policy-enforcing Piwigo Gateway on the narrow
  # internal network. It is not an Immich Web reverse proxy.
  immich-web-compat:
    profiles: ["immich-web-compat"]
    image: ghcr.io/immich-app/immich-server:v3.1.0@sha256:079cc990b26a88d71f96027341c67329cb11829d4c341ce33b3718fe0f84cbfa
    entrypoint: ["node", "/compat/server.mjs"]
    user: "65532:65532"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      CLASS_ARCHIVE_WEB_COMPAT_PORT: "3000"
      CLASS_ARCHIVE_WEB_COMPAT_PUBLIC_PORT: "${CLASS_ARCHIVE_COMPAT_HTTP_PORT:-8091}"
      CLASS_ARCHIVE_CORE_PUBLIC_PORT: "${CLASS_ARCHIVE_CORE_PUBLIC_PORT:-8090}"
      CLASS_ARCHIVE_WEB_ROOT: /web
      CLASS_ARCHIVE_PHOTO_UI_ROOT: /photo-ui
      # This port exists only on the Piwigo↔BFF internal network. Piwigo nginx
      # is the loopback-bound public listener and preserves the original
      # client address for Piwigo's IP-bound session validation.
      CLASS_ARCHIVE_GATEWAY_ORIGIN: http://piwigo:8088
    expose:
      - "3000"
    volumes:
      - ./web-compat:/compat:ro
      - ./photo-ui:/photo-ui:ro
      - ./source/official-v3.1.0/web/build:/web:ro
      # Override the upstream image's declared writable /data VOLUME with a
      # tracked, empty, read-only directory. The compatibility process never
      # needs an Immich data directory, so Docker must not allocate a durable
      # anonymous volume merely because the base image declares one.
      - ./web-compat/empty-data:/data:ro
    tmpfs:
      - /tmp:mode=1777,size=8m
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/healthz').then(function(r){process.exit(r.status === 200 ? 0 : 1)}).catch(function(){process.exit(1)})\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks: [class_archive_gateway]
    restart: "no"

  redis:
    profiles: ["immich-spike"]
    image: docker.io/valkey/valkey:9@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 15
    networks: [immich_internal]
    restart: "no"

  database:
    profiles: ["immich-spike"]
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in infra/immich-spike/.env}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_DB: ${DB_DATABASE_NAME:-immich}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - immich_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --dbname=$${POSTGRES_DB} --username=$${POSTGRES_USER} || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 15
    shm_size: 128mb
    networks: [immich_internal]
    restart: "no"

networks:
  immich_internal:
    driver: bridge
    internal: true
  immich_ml_internal:
    driver: bridge
    internal: true
  immich_bridge_internal:
    driver: bridge
    internal: true
  class_archive_gateway:
    external: true
    name: ${CLASS_ARCHIVE_GATEWAY_NETWORK:-class_archive_immich_gateway}

volumes:
  # Persistent state belonging solely to the disposable Immich spike.
  immich_upload:
    name: ${IMMICH_UPLOAD_VOLUME:-class_archive_immich_spike_upload}
  immich_model_cache:
    name: ${IMMICH_MODEL_CACHE_VOLUME:-class_archive_immich_spike_model_cache}
  immich_db:
    name: ${IMMICH_DB_VOLUME:-class_archive_immich_spike_db}
  # Per-run secret staging volume. It contains no originals and is deleted by
  # the runtime reset; do not reuse it for configuration or durable state.
  immich_gateway_secret:
    name: ${IMMICH_GATEWAY_SECRET_VOLUME:-class_archive_immich_gateway_secret}
  # Existing Piwigo originals, deliberately read-only in the server service.
  piwigo_uploads:
    external: true
    name: ${PIWIGO_UPLOADS_VOLUME:?Set PIWIGO_UPLOADS_VOLUME in infra/immich-spike/.env}
  piwigo_galleries:
    external: true
    name: ${PIWIGO_GALLERIES_VOLUME:?Set PIWIGO_GALLERIES_VOLUME in infra/immich-spike/.env}
