services:
  immich-server:
    labels:
      com.classarchive.scope: owner-restore-drill
      com.classarchive.storage: m-ext4-bind
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the ignored restore env}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME:-immich}
      TZ: ${TZ:-Asia/Shanghai}
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "2"

  immich-machine-learning:
    labels:
      com.classarchive.scope: owner-restore-drill
      com.classarchive.storage: m-ext4-bind
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "2"

  immich-gateway:
    labels:
      com.classarchive.scope: owner-restore-drill
      com.classarchive.storage: m-ext4-bind
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "2"

  immich-gateway-secret-stager:
    labels:
      com.classarchive.scope: owner-restore-drill
      com.classarchive.storage: m-ext4-bind

  immich-web-compat:
    labels:
      com.classarchive.scope: owner-restore-drill
      com.classarchive.storage: m-ext4-bind
    environment:
      CLASS_ARCHIVE_PHOTO_UI_ROOT: /photo-ui
      CLASS_ARCHIVE_CORE_PUBLIC_PORT: ${CLASS_ARCHIVE_CORE_PUBLIC_PORT:?Set the restore core port}
    volumes:
      - ./photo-ui:/photo-ui:ro
    networks:
      class_archive_gateway:
        ipv4_address: 10.245.0.10
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "2"

  redis:
    labels:
      com.classarchive.scope: owner-restore-drill
      com.classarchive.storage: m-ext4-bind
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "2"

  database:
    labels:
      com.classarchive.scope: owner-restore-drill
      com.classarchive.storage: m-ext4-bind
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "2"

networks:
  immich_internal:
    labels:
      com.classarchive.scope: owner-restore-drill
    ipam:
      config:
        - subnet: 10.245.2.0/24
  immich_ml_internal:
    labels:
      com.classarchive.scope: owner-restore-drill
    ipam:
      config:
        - subnet: 10.245.3.0/24
  immich_bridge_internal:
    labels:
      com.classarchive.scope: owner-restore-drill
    ipam:
      config:
        - subnet: 10.245.4.0/24

volumes:
  immich_upload:
    labels:
      com.classarchive.scope: owner-restore-drill
      com.classarchive.storage: m-ext4-bind
  immich_model_cache:
    labels:
      com.classarchive.scope: owner-restore-drill
      com.classarchive.storage: m-ext4-bind
  immich_db:
    labels:
      com.classarchive.scope: owner-restore-drill
      com.classarchive.storage: m-ext4-bind
  immich_gateway_secret:
    labels:
      com.classarchive.scope: owner-restore-drill
      com.classarchive.storage: m-ext4-bind
