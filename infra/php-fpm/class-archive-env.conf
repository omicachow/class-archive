[www]
; PHP-FPM clears the process environment by default. Expose only the two
; application secrets required by ClassIdentity HTTP requests plus the
; non-secret numeric Piwigo durable service identity used to validate an
; inherited-ACL bridge secret. Do not disable clear_env globally and do not
; place secret values in this tracked file.
env[CLASS_ARCHIVE_CLAIM_CODE_PEPPER] = $CLASS_ARCHIVE_CLAIM_CODE_PEPPER
env[CLASS_ARCHIVE_ANONYMOUS_PSEUDONYM_SECRET] = $CLASS_ARCHIVE_ANONYMOUS_PSEUDONYM_SECRET
env[PIWIGO_UID] = $PIWIGO_UID
env[PIWIGO_GID] = $PIWIGO_GID
env[CLASS_ARCHIVE_COMPAT_HTTP_PORT] = $CLASS_ARCHIVE_COMPAT_HTTP_PORT
