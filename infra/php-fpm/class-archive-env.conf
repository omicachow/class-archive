[www]
; PHP-FPM clears the process environment by default. Expose only the two
; application secrets required by ClassIdentity HTTP requests; do not disable
; clear_env globally and do not place secret values in this tracked file.
env[CLASS_ARCHIVE_CLAIM_CODE_PEPPER] = $CLASS_ARCHIVE_CLAIM_CODE_PEPPER
env[CLASS_ARCHIVE_ANONYMOUS_PSEUDONYM_SECRET] = $CLASS_ARCHIVE_ANONYMOUS_PSEUDONYM_SECRET
