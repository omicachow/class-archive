user nginx;
worker_processes auto;

error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    # PHP's framework/version banner provides no application value to clients
    # and must not differ between public denial, Core sign-in and MediaGuard
    # responses. Keep it off on every FastCGI path, including redirects.
    fastcgi_hide_header X-Powered-By;

    # Never log a request target, query string or Referer. Claim and invitation
    # credentials are rejected when supplied in a URL, but the web server sees
    # that URL before PHP can reject it. This deliberately trades per-route
    # access diagnostics for a hard guarantee that a misplaced credential is
    # not copied into the container log.
    log_format class_archive_safe '$time_iso8601 method=$request_method status=$status bytes=$body_bytes_sent duration=$request_time';
    access_log /dev/stdout class_archive_safe;

    # Docker's embedded DNS is used only for the variable proxy target below.
    # It keeps Piwigo restartable while the opt-in compatibility BFF is absent;
    # an absent target becomes a bounded generic 503 rather than an nginx
    # config-load failure.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    map $http_x_forwarded_prefix $piwigo_prefix {
        default "";
        ~^/.* $http_x_forwarded_prefix;
    }

    # `$realip_remote_addr` retains the TCP peer before the 8088 server
    # restores the browser address from a BFF-generated X-Forwarded-For.
    # Treat the marker header as meaningful only when it came from one of the
    # exact compatibility BFF addresses declared by the isolated Compose
    # networks; a peer on another internal network cannot mint this route by
    # sending an otherwise identical header.
    map $realip_remote_addr $class_archive_web_compat_bff_source {
        default 0;
        172.23.0.10 1;
        172.27.0.10 1;
        10.241.0.10 1;
        # V4 synthetic browser-runtime BFF. This is deliberately an exact
        # peer address on its dedicated synthetic gateway, never its CIDR.
        10.249.0.10 1;
        # The second V4 synthetic recovery attempt is deliberately on a
        # different bridge, but receives the same exact-peer treatment. Do
        # not widen this to the 10.250.0.0/16 subnet.
        10.250.0.10 1;
        # A later corrected retry uses another fixed bridge, again with one
        # exact peer only. This is intentionally not a subnet allow rule.
        10.251.0.10 1;
        # The file-backed probe retry remains a separately fixed exact peer.
        # Do not turn this into a trust rule for the 10.252.0.0/16 subnet.
        10.252.0.10 1;
        # The explicit-subnet retry gets the same exact-peer limitation.
        10.253.0.10 1;
    }

    server {
        listen 80;
        server_name localhost;
        root /var/www/html/piwigo;
        index index.php index.html index.htm;
        client_max_body_size 32m;

        # The plugin installer creates this persistent marker before opening
        # its bounded identity bootstrap window. If the process or host dies
        # while enforcement is disabled, every HTTP route remains fail-closed
        # until a successful installer run restores enforcement and removes
        # the marker. CLI repair remains available inside the container.
        set $class_archive_maintenance_gate 0;
        if (-f $document_root/_data/.class-archive-maintenance) {
            set $class_archive_maintenance_gate 1;
        }
        if ($uri = /_class_archive_internal/maintenance) {
            set $class_archive_maintenance_gate 0;
        }
        if ($class_archive_maintenance_gate = 1) {
            return 418;
        }
        error_page 418 = /_class_archive_internal/maintenance;

        location = /_class_archive_internal/maintenance {
            internal;
            default_type text/plain;
            return 503 "Class Archive maintenance mode.\n";
            add_header Cache-Control "private, no-store, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Vary "Cookie" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        # The future photo front end speaks only to the Class Archive Gateway,
        # never to Piwigo or Immich schemas directly. Keep this same-origin
        # rewrite narrow: the controller validates every route/query pair,
        # resolves ClassIdentity on every request and, for canonical media,
        # re-enters MediaGuard before nginx internal delivery. It is never a
        # proxy to the isolated Immich network.
        location = /api {
            default_type text/plain;
            return 404 "Not found.\n";
            add_header Cache-Control "private, no-store, max-age=0" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        location = /_class_archive_internal/api-unavailable {
            internal;
            default_type application/json;
            return 503 '{"error":"数据暂时无法安全确认"}';
            add_header Cache-Control "private, no-store, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Vary "Cookie" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        location ^~ /api/ {
            # `rewrite` preserves the original query string when the
            # replacement supplies its route key. Do not append `$args` here:
            # doing so duplicates e.g. `q=...`, which the controller rightly
            # treats as parameter pollution and denies.
            rewrite ^/api/(.*)$ /index.php?/class-archive-api/$1 break;
            include /etc/nginx/fastcgi.conf;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_intercept_errors on;
            # Preserve an intentional fail-closed Gateway 503 on this
            # internal-only hop.  The BFF receives its bounded diagnostic
            # header, discards it before the browser response, and still
            # returns the same generic 503.  FastCGI transport/runtime errors
            # remain mapped to the fixed unavailable response below.
            error_page 500 502 504 =503 /_class_archive_internal/api-unavailable;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param REQUEST_URI /index.php$is_args$args;
            fastcgi_param PHP_SELF /index.php;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param HTTP_COOKIE $http_cookie;
            fastcgi_param CLASS_ARCHIVE_WEB_COMPAT_INTERNAL 0;
        }

        # Bare media roots must never fall through to nginx's automatic
        # directory slash redirect. Apart from bypassing the authorization
        # gateway, that redirect can also lose a non-default localhost port.
        location = /upload {
            default_type text/plain;
            return 404 "Media not found.\n";
            add_header Cache-Control "private, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Vary "Cookie" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        location = /galleries {
            default_type text/plain;
            return 404 "Media not found.\n";
            add_header Cache-Control "private, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Vary "Cookie" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        location = /_data/i {
            default_type text/plain;
            return 404 "Media not found.\n";
            add_header Cache-Control "private, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Vary "Cookie" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        # Piwigo writes logs, compiled templates, mail payloads and transient
        # state below `_data`. Apache deployments rely on per-directory rules;
        # nginx does not read those files. Only generated public CSS/JS and the
        # separately guarded derivative tree may be addressed over HTTP.
        location ^~ /_data/combined/ {
            try_files $uri =404;
            add_header Cache-Control "private, max-age=86400" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        location = /_data {
            default_type text/plain;
            return 404 "Not found.\n";
            add_header Cache-Control "private, no-store, max-age=0" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        location ^~ /_data/ {
            # Clear the filename extension map before the denial response.
            # Otherwise nginx can label a 404 for a guessed .png/.jpg path as
            # image/* even though no bytes were returned.
            types { }
            default_type text/plain;
            return 404 "Not found.\n";
            add_header Cache-Control "private, no-store, max-age=0" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        # Upstream failures on protected media routes must not expose PHP,
        # database or filesystem diagnostics. Each media FastCGI location
        # below intercepts 5xx responses and lands here as a generic 503.
        location = /_class_archive_internal/media-unavailable {
            internal;
            default_type text/plain;
            return 503 "Media temporarily unavailable.\n";
            add_header Cache-Control "private, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Vary "Cookie" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        # No source or derivative file is public static content. Every request
        # first executes ClassArchivePolicy's MediaGuard. On ALLOW, PHP emits
        # an X-Accel-Redirect to one of the internal locations below and nginx
        # performs the actual file transfer (including HEAD and Range).
        location ^~ /upload/ {
            include /etc/nginx/fastcgi.conf;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_intercept_errors on;
            error_page 500 502 503 504 =503 /_class_archive_internal/media-unavailable;
            fastcgi_param SCRIPT_FILENAME $document_root/plugins/ClassArchivePolicy/media-gateway.php;
            fastcgi_param SCRIPT_NAME /plugins/ClassArchivePolicy/media-gateway.php;
            fastcgi_param CLASS_ARCHIVE_MEDIA_GATEWAY 1;
            fastcgi_param CLASS_ARCHIVE_MEDIA_KIND source_path;
            fastcgi_param CLASS_ARCHIVE_MEDIA_URI $uri;
            fastcgi_param CLASS_ARCHIVE_MEDIA_ORIGINAL_URI $request_uri;
            fastcgi_param HTTP_COOKIE $http_cookie;
        }

        location ^~ /galleries/ {
            include /etc/nginx/fastcgi.conf;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_intercept_errors on;
            error_page 500 502 503 504 =503 /_class_archive_internal/media-unavailable;
            fastcgi_param SCRIPT_FILENAME $document_root/plugins/ClassArchivePolicy/media-gateway.php;
            fastcgi_param SCRIPT_NAME /plugins/ClassArchivePolicy/media-gateway.php;
            fastcgi_param CLASS_ARCHIVE_MEDIA_GATEWAY 1;
            fastcgi_param CLASS_ARCHIVE_MEDIA_KIND source_path;
            fastcgi_param CLASS_ARCHIVE_MEDIA_URI $uri;
            fastcgi_param CLASS_ARCHIVE_MEDIA_ORIGINAL_URI $request_uri;
            fastcgi_param HTTP_COOKIE $http_cookie;
        }

        location ^~ /_data/i/ {
            include /etc/nginx/fastcgi.conf;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_intercept_errors on;
            error_page 500 502 503 504 =503 /_class_archive_internal/media-unavailable;
            fastcgi_param SCRIPT_FILENAME $document_root/plugins/ClassArchivePolicy/media-gateway.php;
            fastcgi_param SCRIPT_NAME /plugins/ClassArchivePolicy/media-gateway.php;
            fastcgi_param CLASS_ARCHIVE_MEDIA_GATEWAY 1;
            fastcgi_param CLASS_ARCHIVE_MEDIA_KIND derivative_path;
            fastcgi_param CLASS_ARCHIVE_MEDIA_URI $uri;
            fastcgi_param CLASS_ARCHIVE_MEDIA_ORIGINAL_URI $request_uri;
            fastcgi_param HTTP_COOKIE $http_cookie;
        }

        location = /i.php {
            include /etc/nginx/fastcgi.conf;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_intercept_errors on;
            error_page 500 502 503 504 =503 /_class_archive_internal/media-unavailable;
            fastcgi_param SCRIPT_FILENAME $document_root/plugins/ClassArchivePolicy/media-gateway.php;
            fastcgi_param SCRIPT_NAME /plugins/ClassArchivePolicy/media-gateway.php;
            fastcgi_param CLASS_ARCHIVE_MEDIA_GATEWAY 1;
            fastcgi_param CLASS_ARCHIVE_MEDIA_KIND derivative_script;
            fastcgi_param CLASS_ARCHIVE_MEDIA_URI $uri;
            fastcgi_param CLASS_ARCHIVE_MEDIA_ORIGINAL_URI $request_uri;
            fastcgi_param HTTP_COOKIE $http_cookie;
        }

        # Core generates action.php links for originals. Keep that stable public
        # contract, but replace Core's PHP readfile transfer with MediaGuard +
        # nginx internal delivery.
        location = /action.php {
            include /etc/nginx/fastcgi.conf;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_intercept_errors on;
            error_page 500 502 503 504 =503 /_class_archive_internal/media-unavailable;
            fastcgi_param SCRIPT_FILENAME $document_root/plugins/ClassArchivePolicy/media-gateway.php;
            fastcgi_param SCRIPT_NAME /plugins/ClassArchivePolicy/media-gateway.php;
            fastcgi_param CLASS_ARCHIVE_MEDIA_GATEWAY 1;
            fastcgi_param CLASS_ARCHIVE_MEDIA_KIND action;
            fastcgi_param CLASS_ARCHIVE_MEDIA_URI $uri;
            fastcgi_param CLASS_ARCHIVE_MEDIA_ORIGINAL_URI $request_uri;
            fastcgi_param HTTP_COOKIE $http_cookie;
        }

        # The gateway is never a directly callable public controller. Nginx is
        # the trusted dispatcher and supplies CLASS_ARCHIVE_MEDIA_GATEWAY.
        location = /plugins/ClassArchivePolicy/media-gateway.php {
            return 404;
        }

        location = /plugins/ClassArchivePolicy/derivative-generator.php {
            return 404;
        }

        location = /plugins/ClassArchivePolicy/identity-derivative-fallback.php {
            return 404;
        }

        location ^~ /_class_archive_internal/source/upload/ {
            internal;
            alias /var/www/html/piwigo/upload/;
            add_header Cache-Control "private, no-cache, must-revalidate, max-age=0, no-transform" always;
            add_header Pragma "no-cache" always;
            add_header Vary "Cookie" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        location ^~ /_class_archive_internal/source/galleries/ {
            internal;
            alias /var/www/html/piwigo/galleries/;
            add_header Cache-Control "private, no-cache, must-revalidate, max-age=0, no-transform" always;
            add_header Pragma "no-cache" always;
            add_header Vary "Cookie" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        location ^~ /_class_archive_internal/derivative/ {
            internal;
            alias /var/www/html/piwigo/_data/i/;
            add_header Cache-Control "private, no-cache, must-revalidate, max-age=0, no-transform" always;
            add_header Pragma "no-cache" always;
            add_header Vary "Cookie" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        location ~ /\. {
            deny all;
        }

        location ^~ /local/config/ {
            deny all;
        }

        # Installation and upgrade entry points are never public runtime
        # surfaces. Fresh localhost bootstrap may execute install.php only
        # before Core creates database.inc.php; every installed system gets an
        # exact 404. Upgrades remain an explicit maintenance/CLI operation.
        location = /install.php {
            if (-f $document_root/local/config/database.inc.php) {
                return 404;
            }
            include /etc/nginx/fastcgi.conf;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root/install.php;
        }

        location = /upgrade.php {
            return 404;
        }

        location = /upgrade_feed.php {
            return 404;
        }

        location = /install {
            return 404;
        }

        location ^~ /install/ {
            return 404;
        }

        location = /tools {
            return 404;
        }

        location ^~ /tools/ {
            return 404;
        }

        location ~ \.php$ {
            try_files $uri =404;
            include /etc/nginx/fastcgi.conf;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_NAME $piwigo_prefix$fastcgi_script_name;
            fastcgi_param REQUEST_URI $piwigo_prefix$uri$is_args$args;
            fastcgi_param PHP_SELF $piwigo_prefix$fastcgi_script_name;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTP_COOKIE $http_cookie;
            fastcgi_param CLASS_ARCHIVE_WEB_COMPAT_INTERNAL 0;
        }
    }

    # Local-only Immich Web presentation ingress. The BFF itself has no host
    # listener: browser requests first enter this Piwigo nginx process at the
    # explicit IPv4-loopback mapping selected by Compose. nginx overwrites the forwarded
    # source header from its own socket, so the BFF can later re-enter the
    # internal Gateway without breaking Piwigo's IP-bound session check.
    server {
        listen 8081;
        server_name _;
        root /var/www/html/piwigo;
        client_max_body_size 32m;

        location = /_class_archive_web_compat_unavailable {
            internal;
            default_type text/plain;
            return 503 "Compatibility web temporarily unavailable.\n";
            add_header Cache-Control "private, no-store, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        # nginx itself rejects some malformed encoded paths before proxying.
        # Give those rejections the same private, non-cacheable contract as
        # the compatibility service rather than leaking a default error page
        # or a cacheable status-only response.
        error_page 400 = /_class_archive_web_compat_invalid_request;
        location = /_class_archive_web_compat_invalid_request {
            internal;
            default_type text/plain;
            return 400 "Invalid request.\n";
            add_header Cache-Control "private, no-store, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        # The BFF never transfers media bytes. After it validates the narrow
        # X-Accel target returned by the internal Gateway, nginx handles this
        # same request's file delivery through these internal-only locations.
        location ^~ /_class_archive_internal/source/upload/ {
            internal;
            alias /var/www/html/piwigo/upload/;
            add_header Cache-Control "private, no-cache, must-revalidate, max-age=0, no-transform" always;
            add_header Pragma "no-cache" always;
            add_header Vary "Cookie" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        location ^~ /_class_archive_internal/source/galleries/ {
            internal;
            alias /var/www/html/piwigo/galleries/;
            add_header Cache-Control "private, no-cache, must-revalidate, max-age=0, no-transform" always;
            add_header Pragma "no-cache" always;
            add_header Vary "Cookie" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        location ^~ /_class_archive_internal/derivative/ {
            internal;
            alias /var/www/html/piwigo/_data/i/;
            add_header Cache-Control "private, no-cache, must-revalidate, max-age=0, no-transform" always;
            add_header Pragma "no-cache" always;
            add_header Vary "Cookie" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        # The sole browser-facing multipart ingress.  It is deliberately
        # separate from the ordinary BFF location so only this exact route
        # accepts a body large enough for the bounded member-photo contract.
        # Request buffering is disabled here and on the two downstream hops:
        # browser bytes can apply TCP backpressure while the BFF verifies the
        # session, then it streams them to the one fixed private target.
        location = /api/class-archive/member-upload {
            client_max_body_size 21m;
            client_body_timeout 70s;
            set $class_archive_web_compat_upstream immich-web-compat:3000;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_set_header Host $http_host;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Class-Archive-Web-Compat-Proxy "1";
            proxy_set_header Connection "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 75s;
            proxy_intercept_errors on;
            error_page 502 503 504 =503 /_class_archive_web_compat_unavailable;
            proxy_pass http://$class_archive_web_compat_upstream$request_uri;
        }

        location / {
            # A caller supplied X-Forwarded-For is never propagated. The BFF
            # sees only the address nginx observed for this loopback request.
            set $class_archive_web_compat_upstream immich-web-compat:3000;
            proxy_http_version 1.1;
            # Preserve the browser's loopback Host including its public port.
            # The BFF independently requires the exact configured authority.
            proxy_set_header Host $http_host;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Class-Archive-Web-Compat-Proxy "1";
            proxy_set_header Connection "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_intercept_errors on;
            error_page 502 503 504 =503 /_class_archive_web_compat_unavailable;
            proxy_pass http://$class_archive_web_compat_upstream$request_uri;
        }
    }

    # The BFF's only Piwigo-facing listener. It is never host-published. The
    # source is the dedicated internal gateway bridge, and only requests that
    # carry the BFF's fixed internal marker may enter the existing canonical
    # Gateway rewrite. realip restores precisely the client address captured
    # by the public nginx proxy above; this preserves Piwigo's session IP hash
    # without trusting an HTTP client-provided forwarding header.
    server {
        listen 8088;
        server_name _;
        root /var/www/html/piwigo;
        default_type text/plain;
        client_max_body_size 8k;

        # These are the deterministic, internal-only compatibility BFF
        # addresses declared by Compose. Do not trust an entire Docker
        # subnet: the Immich adapter shares the bridge but may not restore a
        # browser address for Piwigo's IP-bound session validation.
        set_real_ip_from 172.23.0.10/32;
        set_real_ip_from 172.27.0.10/32;
        # Full-library blue/green compatibility BFF. It has its own isolated
        # gateway network and is intentionally trusted as one exact address.
        set_real_ip_from 10.241.0.10/32;
        # V4 synthetic browser-runtime BFF. Do not broaden this to its
        # gateway subnet: the source map above is part of the same gate.
        set_real_ip_from 10.249.0.10/32;
        # Independent retry laboratory; again, trust exactly one BFF peer.
        set_real_ip_from 10.250.0.10/32;
        # Third fixed laboratory, preserved independently from attempts 1/2.
        set_real_ip_from 10.251.0.10/32;
        # Fourth fixed laboratory; only its BFF address is a trusted proxy.
        set_real_ip_from 10.252.0.10/32;
        # Fifth fixed laboratory; the companion application subnet is never
        # trusted as a proxy.
        set_real_ip_from 10.253.0.10/32;
        real_ip_header X-Forwarded-For;
        real_ip_recursive off;

        if ($class_archive_web_compat_bff_source != 1) {
            return 404;
        }
        if ($http_x_class_archive_web_compat_internal != "1") {
            return 404;
        }
        if (-f $document_root/_data/.class-archive-maintenance) {
            return 503;
        }

        # Fixed member-photo publish bridge. This is intentionally *not*
        # marked `internal`: the compatibility BFF must POST across the
        # private Docker network to this exact endpoint. Port 8088 is not
        # host-published, the server-level BFF marker gate applies, and this
        # route has no variable upstream/path component, so it cannot become a
        # generic upload proxy. PHP still validates the Piwigo session CSRF,
        # role, explicit era, and opaque album mapping before any publication.
        location = /member-upload {
            # The service permits a 20 MiB file. Leave only bounded multipart
            # framing room here; BFF rejects over-limit Content-Length before
            # streaming and PHP repeats the file-size check.
            client_max_body_size 21m;
            client_body_timeout 60s;
            rewrite ^ /index.php?/class-identity/member-upload break;
            include /etc/nginx/fastcgi.conf;
            fastcgi_pass 127.0.0.1:9000;
            # Keep the BFF-to-FPM handoff streaming. Node never collects the
            # multipart body; PHP's normal upload handler owns its temporary
            # file after this private hop.
            fastcgi_request_buffering off;
            fastcgi_buffering off;
            fastcgi_read_timeout 60s;
            fastcgi_send_timeout 60s;
            fastcgi_intercept_errors on;
            error_page 500 502 503 504 =503 /_class_archive_internal/api-unavailable;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param REQUEST_URI /index.php$is_args$args;
            fastcgi_param PHP_SELF /index.php;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param HTTP_COOKIE $http_cookie;
            # Do not allow Host / X-Forwarded-* / Origin input to turn this
            # private hop into a trusted browser route. The fixed FastCGI
            # marker is set by nginx itself and the BFF reconstructs only the
            # minimal controlled headers.
            fastcgi_param HTTP_HOST piwigo;
            fastcgi_param HTTP_ORIGIN "";
            fastcgi_param HTTP_SEC_FETCH_SITE "";
            fastcgi_param HTTP_X_FORWARDED_FOR "";
            fastcgi_param HTTP_X_REAL_IP "";
            # The BFF reconstructs this session-bound token after it has
            # validated the outer same-origin request. PHP repeats a strict
            # body/header equality check before publication.
            fastcgi_param HTTP_X_CLASS_ARCHIVE_CSRF $http_x_class_archive_csrf;
            fastcgi_param CLASS_ARCHIVE_WEB_COMPAT_INTERNAL 1;
        }

        location = /api {
            return 404;
        }

        location = /_class_archive_internal/api-unavailable {
            internal;
            default_type application/json;
            return 503 '{"error":"数据暂时无法安全确认"}';
            add_header Cache-Control "private, no-store, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Vary "Cookie" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        location ^~ /api/ {
            rewrite ^/api/(.*)$ /index.php?/class-archive-api/$1 break;
            include /etc/nginx/fastcgi.conf;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_intercept_errors on;
            error_page 500 502 503 504 =503 /_class_archive_internal/api-unavailable;
            fastcgi_ignore_headers X-Accel-Redirect;
            fastcgi_pass_header X-Accel-Redirect;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param REQUEST_URI /index.php$is_args$args;
            fastcgi_param PHP_SELF /index.php;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param HTTP_COOKIE $http_cookie;
            fastcgi_param CLASS_ARCHIVE_WEB_COMPAT_INTERNAL 1;
        }

        # Canonical Gateway media dispatches only after ClassIdentity policy
        # filtering and MediaGuard authorization. X-Accel redirects are scoped
        # to their current nginx server, so the private BFF listener needs the
        # same internal-only delivery targets as the public MediaGuard server.
        # These locations are not public routes: direct BFF requests remain
        # rejected by nginx's `internal` guard before any file can be read.
        location ^~ /_class_archive_internal/source/upload/ {
            internal;
            alias /var/www/html/piwigo/upload/;
            add_header Cache-Control "private, no-cache, must-revalidate, max-age=0, no-transform" always;
            add_header Pragma "no-cache" always;
            add_header Vary "Cookie" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        location ^~ /_class_archive_internal/source/galleries/ {
            internal;
            alias /var/www/html/piwigo/galleries/;
            add_header Cache-Control "private, no-cache, must-revalidate, max-age=0, no-transform" always;
            add_header Pragma "no-cache" always;
            add_header Vary "Cookie" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        location ^~ /_class_archive_internal/derivative/ {
            internal;
            alias /var/www/html/piwigo/_data/i/;
            add_header Cache-Control "private, no-cache, must-revalidate, max-age=0, no-transform" always;
            add_header Pragma "no-cache" always;
            add_header Vary "Cookie" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        location = /index.php {
            include /etc/nginx/fastcgi.conf;
            fastcgi_pass 127.0.0.1:9000;
            # Canonical media must hand its authorized X-Accel target back to
            # the BFF, not consume it on this inner listener. The BFF validates
            # the target and outer loopback nginx serves it through its own
            # internal-only aliases above.
            fastcgi_ignore_headers X-Accel-Redirect;
            fastcgi_pass_header X-Accel-Redirect;
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;
            fastcgi_param REQUEST_URI $uri$is_args$args;
            fastcgi_param PHP_SELF $fastcgi_script_name;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTP_COOKIE $http_cookie;
            # This server variable is supplied by nginx itself and cannot be
            # forged by a browser header on the public listener.
            fastcgi_param CLASS_ARCHIVE_WEB_COMPAT_INTERNAL 1;
        }

        location / {
            return 404;
        }
    }
}
