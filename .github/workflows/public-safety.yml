name: Public safety

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tracked-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject private artifact names
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files | grep -Ei '(^|/)(\.env($|\.)|.*\.(sql|dump|sqlite|db|pem|key|p12|pfx|jpg|jpeg|png|webp|heic)$|uploads?/|backups?/|database-exports?/)' | grep -Ev '(^|/)\.env\.example$' || true)"
          if [[ -n "$forbidden" ]]; then
            printf '%s\n' "Tracked private artifacts are not allowed:" >&2
            printf '%s\n' "$forbidden" >&2
            exit 1
          fi

      - name: Reject high-risk credential material
        shell: bash
        run: |
          set -euo pipefail
          gh_prefix="gh""o_"
          pat_prefix="github_pat_"
          key_marker="BEGIN (RSA|OPENSSH|EC|DSA|PGP) PRIVATE KEY"
          aws_prefix="AKIA[0-9A-Z]{16}"
          pattern="${gh_prefix}[A-Za-z0-9]{20,}|${pat_prefix}[A-Za-z0-9_]{20,}|${aws_prefix}|${key_marker}"
          if git grep -n -I -E "$pattern" -- .; then
            echo "High-risk credential material found in tracked content." >&2
            exit 1
          fi
